name: Build Boards

on:
  # Manual runs exercise the full matrix, including CI-specific options.
  workflow_dispatch:
  push:
    branches:
      - main
      - ci/* # for ci test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # 工具脚本的单元测试单独跑，和编译并行，不再挡在编译前面。
  test-tooling:
    name: Test build tooling
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v

  # 只判断要不要编译，不拉 IDF 镜像（拉镜像就要 1 分半）。
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: select
        name: Select variants based on changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # build.py 从 $IDF_PATH/tools/cmake/version.cmake 读 IDF 版本来挑板子；
          # 这里没有 IDF，只放一个版本文件，和下面编译用的 release-v6.1 镜像对齐。
          export IDF_PATH="$RUNNER_TEMP/idf-version-only"
          mkdir -p "$IDF_PATH/tools/cmake"
          printf 'set(IDF_VERSION_MAJOR 6)\nset(IDF_VERSION_MINOR 1)\nset(IDF_VERSION_PATCH 0)\n' \
            > "$IDF_PATH/tools/cmake/version.cmake"

          CHANGED_FILE="$RUNNER_TEMP/changed-files.txt"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git ls-files > "$CHANGED_FILE"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Checkout is the synthetic merge commit. Compare the PR branch
            # from its merge base, excluding unrelated updates on main.
            git diff --name-only --no-renames HEAD^1...HEAD^2 > "$CHANGED_FILE"
          elif [[ "$BEFORE_SHA" =~ ^0+$ && "$GITHUB_REF" != "refs/heads/main" ]] && \
               BASE_SHA=$(git merge-base HEAD origin/main); then
            # First push of a ci/* branch has an all-zero before SHA.
            git diff --name-only --no-renames "$BASE_SHA" HEAD > "$CHANGED_FILE"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && \
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames "$BEFORE_SHA" HEAD > "$CHANGED_FILE"
          else
            # A missing baseline (e.g. an unavailable force-pushed commit)
            # must not silently omit changed boards.
            git ls-files > "$CHANGED_FILE"
          fi

          cat "$CHANGED_FILE"

          # Keep the full manual matrix out of environment variables.
          python3 scripts/build.py --select-changed < "$CHANGED_FILE" > "$RUNNER_TEMP/variants.json"
          {
            printf 'variants='
            cat "$RUNNER_TEMP/variants.json"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.ci_name || matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        # This fork only packages its own two boards; prepare's change
        # detection still skips firmware builds for docs-only changes.
        include:
          # 32MB layout (16MB assets) so large custom themes fit; separate
          # name keeps official 16MB OTA images off these devices.
          - board: waveshare/esp32-s3-touch-amoled-1.75
            name: esp32-s3-touch-amoled-1.75c-32m
            full_name: waveshare-esp32-s3-touch-amoled-1.75c-32m
          - board: lckfb/szpi-esp32s3
            name: lichuang-dev
            full_name: lckfb-lichuang-dev
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    env:
      # 镜像已开 IDF_CCACHE_ENABLE=1。ccache 和组件下载缓存放在固定目录，
      # 由 actions/cache 在任务之间保存和恢复（容器里 HOME 是 /github/home）。
      CCACHE_DIR: /github/home/.ccache
      CCACHE_MAXSIZE: 1G
      IDF_COMPONENT_CACHE_PATH: /github/home/.cache/idf-components
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache keys
        id: keys
        shell: bash
        run: |
          # 镜像里的 IDF 换了提交时，组件要重新解析，编译缓存也大多用不上
          IDF_REV=$(git -c safe.directory='*' -C "$IDF_PATH" rev-parse --short HEAD 2>/dev/null || echo unknown)
          echo "idf=$IDF_REV" >> "$GITHUB_OUTPUT"

      # 每次编译都存一份新的，下次从同一块板子最近的一份接着用
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: /github/home/.ccache
          key: ccache-${{ matrix.full_name }}-${{ steps.keys.outputs.idf }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ matrix.full_name }}-${{ steps.keys.outputs.idf }}-
            ccache-${{ matrix.full_name }}-

      # 有 dependencies.lock 就不用每次花 40 秒解析 74 个组件，下载也从本地缓存拷
      - name: Restore IDF components
        uses: actions/cache@v6
        with:
          path: |
            dependencies.lock
            /github/home/.cache/idf-components
          key: idf-components-${{ matrix.full_name }}-${{ steps.keys.outputs.idf }}-${{ hashFiles('main/idf_component.yml') }}

      - name: Build current variant
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          VARIANT: ${{ matrix.name }}
          BUILD_OPTIONS_JSON: ${{ toJSON(matrix.ci_build_options) }}
        run: |
          source "$IDF_PATH/export.sh"
          OPTIONS=()
          if [[ "$BUILD_OPTIONS_JSON" != "null" && -n "$BUILD_OPTIONS_JSON" ]]; then
            OPTIONS+=(--build-options-json "$BUILD_OPTIONS_JSON")
          fi
          ccache --zero-stats
          python scripts/build.py "$BOARD" --name "$VARIANT" --language zh-CN "${OPTIONS[@]}"

      - name: ccache stats
        shell: bash
        run: |
          command -v ccache >/dev/null || source "$IDF_PATH/export.sh" >/dev/null
          ccache --show-stats --verbose
          # 只留这次编译用到的条目，缓存不会越存越大
          ccache --evict-older-than 7200s
          ccache --show-stats

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_${{ matrix.ci_name || matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
